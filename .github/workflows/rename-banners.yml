name: One-time - move project images out of banners/ (adblock-safe names)

on:
  push:
    branches: [main]
    paths: ['.github/workflows/rename-banners.yml']
  workflow_dispatch:

jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - name: Install sshpass
        run: sudo apt-get update -qq && sudo apt-get install -y -qq sshpass

      - name: Rename on server
        env:
          SSHPASS: ${{ secrets.FTP_PASSWORD }}
          SFTP_USER: ${{ secrets.FTP_USERNAME }}
          SFTP_HOST: ${{ secrets.FTP_SERVER }}
          REMOTE_DIR: ${{ vars.SFTP_REMOTE_DIR || 'gamesfoundation' }}
        run: |
          cat > "$RUNNER_TEMP/batch.txt" <<BATCH
          cd ${REMOTE_DIR}
          -mkdir games
          -rename banners/2ways_banner.png games/2ways.png
          -rename banners/beowulf_banner.jpg games/beowulf.jpg
          -rename banners/do_banner.jpg games/do.jpg
          -rename banners/knights_banner.jpg games/knights.jpg
          -rename banners/pg_banner.jpg games/pg.jpg
          -rename banners/pipelinepanic_banner.jpg games/pipelinepanic.jpg
          -rename banners/ponytales_banner.jpg games/ponytales.jpg
          -rename banners/seafarer_banner.jpg games/seafarer.jpg
          -rename banners/sl_banner.jpg games/sl.jpg
          -rename banners/st_banner.jpg games/st.jpg
          -rename banners/stickit_banner.jpg games/stickit.jpg
          -rename banners/tkg_banner.jpg games/tkg.jpg
          -rename banners/traxion2_banner.jpg games/traxion2.jpg
          -rename banners/traxion3000_banner.jpg games/traxion3000.jpg
          -rename banners/traxion_banner.jpg games/traxion.jpg
          -rename banners/tv_banner.jpg games/tv.jpg
          -rename banners/weewaa_banner.jpg games/weewaa.jpg
          ls -la games
          BATCH
          sshpass -e sftp -oBatchMode=no -oStrictHostKeyChecking=accept-new \
            -P 22 -b "$RUNNER_TEMP/batch.txt" "${SFTP_USER}@${SFTP_HOST}"
