name: One-time - delete unused files on server

on:
  push:
    branches: [main]
    paths: ['.github/workflows/delete-unused.yml']

jobs:
  delete:
    runs-on: ubuntu-latest
    steps:
      - name: Install sshpass
        run: sudo apt-get update -qq && sudo apt-get install -y -qq sshpass
      - name: Delete unused files
        env:
          SSHPASS: ${{ secrets.FTP_PASSWORD }}
          SFTP_USER: ${{ secrets.FTP_USERNAME }}
          SFTP_HOST: ${{ secrets.FTP_SERVER }}
          REMOTE_DIR: ${{ vars.SFTP_REMOTE_DIR || 'gamesfoundation' }}
        run: |
          cat > "$RUNNER_TEMP/batch.txt" <<BATCH
          cd ${REMOTE_DIR}
          -rm "at_white.png"
          -rm "awards/Thumbs.db"
          -rm "banners/Thumbs.db"
          -rm "banners/pc_banner.jpg"
          -rm "banners/spacerat_banner.jpg"
          -rm "clients/bigpoint.png"
          -rm "clients/elocom.jpg"
          -rm "clients/fishlabs.png"
          -rm "clients/splitscreen.png"
          -rm "clients/zoink.jpg"
          -rm "emotional.jpg"
          -rm "events/gamescom_logo.png"
          -rm "games/beowulf_banner.jpg"
          -rm "games/do_banner.jpg"
          -rm "games/knights_banner.jpg"
          -rm "games/pg_banner.jpg"
          -rm "games/spaceworm.jpg"
          -rm "games/st_banner.jpg"
          -rm "games/steam-maincapsule-1232x706.jpg"
          -rm "games/stickit_banner.jpg"
          -rm "games/store_capsule_main_1232x706.jpg"
          -rm "games/tkg_banner.jpg"
          -rm "games/traxion2.jpg"
          -rm "games/traxion3000.jpg"
          -rm "games/tv.jpg"
          -rm "games/tv_banner.jpg"
          -rm "games/weewaa_banner.jpg"
          -rm "header.jpg"
          -rm "icons/Thumbs.db"
          -rm "partners/3d-io.png"
          -rm "partners/Thumbs.db"
          -rm "partners/cdv.png"
          -rm "partners/dynamedion.jpg"
          -rm "partners/metricminds.png"
          -rm "partners/toneworx.png"
          -rm "products/traxion.jpg"
          -rm "products/traxion2.jpg"
          -rm "products/traxion3000.jpg"
          -rm "sh_eng_4c_bp_EU_CO-FUNDED_STATE_GOVERNMENT-01.png"
          -rm "soon/index.html"
          -rmdir banners
          -rmdir clients
          -rmdir events
          -rmdir partners
          -rmdir products
          -rmdir soon
          ls -la
          BATCH
          sshpass -e sftp -oBatchMode=no -oStrictHostKeyChecking=accept-new \
            -P 22 -b "$RUNNER_TEMP/batch.txt" "${SFTP_USER}@${SFTP_HOST}"
