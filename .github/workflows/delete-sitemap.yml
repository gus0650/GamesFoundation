name: One-time - delete sitemap.xml on server

on:
  push:
    branches: [main]
    paths: ['.github/workflows/delete-sitemap.yml']

jobs:
  delete:
    runs-on: ubuntu-latest
    steps:
      - name: Install sshpass
        run: sudo apt-get update -qq && sudo apt-get install -y -qq sshpass
      - name: Delete
        env:
          SSHPASS: ${{ secrets.FTP_PASSWORD }}
          SFTP_USER: ${{ secrets.FTP_USERNAME }}
          SFTP_HOST: ${{ secrets.FTP_SERVER }}
          REMOTE_DIR: ${{ vars.SFTP_REMOTE_DIR || 'gamesfoundation' }}
        run: |
          printf 'cd %s\n-rm sitemap.xml\nls\n' "$REMOTE_DIR" > "$RUNNER_TEMP/b.txt"
          sshpass -e sftp -oBatchMode=no -oStrictHostKeyChecking=accept-new -P 22 -b "$RUNNER_TEMP/b.txt" "${SFTP_USER}@${SFTP_HOST}"
