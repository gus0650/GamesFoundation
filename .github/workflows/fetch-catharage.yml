name: One-time - fetch Catharage cover from Steam

on:
  push:
    branches: [main]
    paths: ['.github/workflows/fetch-catharage.yml']

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download 600x900 library capsule
        run: |
          set -e
          q='{"ids":[{"appid":3879850}],"context":{"language":"english","country_code":"DE"},"data_request":{"include_assets":true}}'
          curl -fsSL -G "https://api.steampowered.com/IStoreBrowseService/GetItems/v1/" --data-urlencode "input_json=$q" -o /tmp/items.json
          jq '.response.store_items[0].assets' /tmp/items.json
          fmt=$(jq -r '.response.store_items[0].assets.asset_url_format' /tmp/items.json)
          for key in library_capsule_2x; do
            f=$(jq -r ".response.store_items[0].assets.$key // empty" /tmp/items.json)
            [ -n "$f" ] || continue
            u="https://shared.akamai.steamstatic.com/store_item_assets/${fmt//\$\{FILENAME\}/$f}"
            echo "trying $u"
            if curl -fsSL -o /tmp/c.jpg "$u"; then echo "OK $u"; break; fi
          done
          test -s /tmp/c.jpg
          file /tmp/c.jpg
          cp /tmp/c.jpg games/catharage.jpg
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add games/catharage.jpg
          git commit -m "Add Catharage cover (Steam library capsule 600x900)" && git push
